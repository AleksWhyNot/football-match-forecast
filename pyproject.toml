[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-match-forecast"
version = "1.0.0"
description = "Prematch probabilities with TensorFlow and historical Understat data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tensorflow==2.20.0", "keras==3.11.3", "numpy==2.2.6", "pandas==2.2.3",
  "scipy==1.15.3", "matplotlib==3.10.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
